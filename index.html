:root{--bg:#0b0f0e;--s1:#141a18;--s2:#1b2320;--line:#29322e;--fg:#f1ece1;--mut:#a1a9a2;--gold:#c9a45c;--gold-hi:#e3c98f;--gold-grad:linear-gradient(180deg,#dcbd7b,#b88f47);--ok:#7fd3a3;--warn:#e9c27a;
  --f-d:'KG Display','Cormorant Garamond',Garamond,serif;--f-b:'KG Sans','Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 16px 120px;min-height:100vh;min-height:100dvh;background:radial-gradient(70% 40% at 90% 0%,rgba(201,164,92,.12),transparent 70%)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;background:linear-gradient(var(--bg) 70%,rgba(11,15,14,0))}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font:600 1.45rem var(--f-d);letter-spacing:.05em}
.brand b i{font-style:normal;color:var(--gold)}
.brand small{color:var(--mut);font-size:.78rem}
.chip{display:inline-flex;align-items:baseline;gap:6px;min-height:44px;padding:6px 14px;border-radius:99px;border:1px solid rgba(201,164,92,.4);background:var(--s1);white-space:nowrap}
.chip span{font-size:.78rem;color:var(--mut)}.chip b{font:600 1.3rem var(--f-d);font-feature-settings:"lnum"}
.cartb{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;font-size:1.15rem}
.cartb em{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--gold-grad);color:#16110a;font:700 .78rem/22px var(--f-b);font-style:normal;text-align:center}
h1,h2,h3{font-family:var(--f-d);font-weight:600;margin:0;line-height:1.08}
.hero{padding:18px 0 8px}
.hero h1{font-size:clamp(2.2rem,9vw,3.2rem)}
.hero p{margin:6px 0 0;color:var(--mut);max-width:40ch}
.seg{display:flex;gap:6px;padding:4px;border-radius:99px;background:var(--s1);border:1px solid var(--line);margin:12px 0 4px}
.seg button{flex:1;min-height:46px;border:0;border-radius:99px;background:none;font-weight:700;letter-spacing:.03em;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--gold-grad);color:#16110a}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;margin:0 -16px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--s1);font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.sub{font:600 1.15rem var(--f-d);color:var(--mut);margin:10px 0 -2px}
.it{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;padding:12px;border-radius:20px;background:var(--s1);border:1px solid var(--line)}
.it.on{border-color:rgba(201,164,92,.55)}
.ph{width:84px;height:84px;border-radius:14px;display:grid;place-items:center;font-size:2.2rem;overflow:hidden;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--cc,#c9a45c) 40%,#1b2320),#1b2320 75%)}
.ph img{width:100%;height:100%;object-fit:cover}
.ib{display:flex;flex-direction:column;gap:4px;min-width:0}
.ib h3{font-size:1.3rem;overflow-wrap:anywhere}
.ib p{margin:0;color:var(--mut);font-size:.88rem;line-height:1.35}
.ir{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;flex-wrap:wrap}
.pr{font:600 1.3rem var(--f-d);font-feature-settings:"lnum","tnum"}
.add{min-height:44px;padding:0 20px;border-radius:99px;border:0;background:var(--gold-grad);color:#16110a;font-weight:700}
.q{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:99px;background:var(--s2);border:1px solid var(--line)}
.q button{width:40px;height:40px;border-radius:50%;border:0;background:var(--s1);font-size:1.3rem;font-weight:700}
.q b{min-width:28px;text-align:center;font-feature-settings:"tnum"}

.ln:last-child{border-bottom:0}

.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;border-top:1px dashed var(--line)}

.field{display:flex;flex-direction:column;gap:6px}

.msg{white-space:pre-wrap;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:14px;border-radius:14px;background:var(--s2);color:var(--fg);max-height:260px;overflow:auto;user-select:all}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty span{font-size:3rem;display:block}
.tbl{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.tbl input{font:600 2.6rem var(--f-d);text-align:center;letter-spacing:.1em;padding:10px;border-radius:18px}
.btn{min-height:56px;border-radius:16px;border:0;background:var(--gold-grad);color:#16110a;font-weight:700;font-size:1.05rem}
.note{font-size:.84rem;color:var(--mut);text-align:center;margin:4px 0 0}
.ok{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:rgba(31,170,89,.12);border:1px solid rgba(31,170,89,.4)}

</style>
<div class="app" id="app"></div>
<script>
const D={"date":"03/10/2026 à 00:07","adresse":"Bamako","wa":"22375000001","om":"","moov":"","wave":"","tables":20,"unis":[{"u":"KACTUS","cats":[{"c":"Café","label":"Café","emo":"☕","col":"#c2701f","items":[{"nom":"Latté vanille-cannelle","prix":2500}]}]}]};
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const money=n=>fm(n)+' F';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const IC={'Espèces':'💵','Orange Money':'🟠','Moov Money':'🔵','Wave':'🌊','Carte':'💳'};
const H=String(location.hash||'');
const hT=(H.match(/t(\d{1,3})/i)||[])[1],hW=(H.match(/w(\d{8,15})/i)||[])[1];
const WA=hW||(D&&D.wa)||'';
const st={type:hT?'table':'',table:hT||'',u:'',cat:'',cart:[],mode:'Espèces',note:'',name:'',tel:'',adr:'',rep:'',heure:'',view:'menu',sent:false,last:'',tried:false};
try{const s=JSON.parse(ls.get('kg.carte2')||'null');if(s&&Date.now()-s.at<6*3600e3){['cart','note','name','tel','adr','rep','mode'].forEach(k=>{if(s[k]!=null)st[k]=s[k]});if(!hT&&s.type&&s.type!=='table')st.type=s.type}}catch(e){}
const save=()=>ls.set('kg.carte2',JSON.stringify({cart:st.cart,note:st.note,name:st.name,tel:st.tel,adr:st.adr,rep:st.rep,mode:st.mode,type:st.type,at:Date.now()}));
const unis=()=>(D&&D.unis)||[];
const U=()=>unis().find(u=>u.u===st.u)||unis()[0];
const total=()=>st.cart.reduce((a,i)=>a+i.q*i.p,0),count=()=>st.cart.reduce((a,i)=>a+i.q,0);
const qOf=(u,n)=>{const x=st.cart.find(i=>i.u===u&&i.n===n);return x?x.q:0};
const find=(u,n)=>{for(const c of (unis().find(x=>x.u===u)||{cats:[]}).cats)for(const it of c.items)if(it.nom===n)return it;return null};
const telOk=()=>String(st.tel).replace(/\D/g,'').replace(/^00223|^223/,'').length===8;
const TYPES={livraison:'Livraison',emporter:'À emporter',table:'Sur place'};
const modes=()=>st.type==='livraison'?['Espèces','Orange Money','Moov Money','Wave']:['Espèces','Orange Money','Moov Money','Wave','Carte'];
function missing(){
  const m=[];if(st.type==='table')return m;
  if(!st.type)m.push('le mode : à emporter ou livraison');
  if(!st.name.trim())m.push('votre prénom');
  if(!telOk())m.push('votre numéro de téléphone (8 chiffres)');
  if(st.type==='livraison'&&!st.adr.trim())m.push('l\'adresse de livraison');
  return m;
}
function msg(){
  const L=['🛎️ *Commande KACTUS · TALA*','Type : '+(TYPES[st.type]||'')];
  if(st.type==='table')L.push('Table : '+st.table);
  if(st.name.trim())L.push('Nom : '+st.name.trim());
  if(st.type!=='table'&&st.tel.trim())L.push('Téléphone : '+st.tel.trim());
  if(st.type==='livraison'){L.push('Adresse : '+st.adr.trim());if(st.rep.trim())L.push('Repère : '+st.rep.trim())}
  if(st.type!=='table')L.push('Heure : '+(st.heure||'Dès que possible'));
  L.push('━━━━━━━━━━');
  ['KACTUS','TALA'].forEach(u=>{const g=st.cart.filter(i=>i.u===u);if(!g.length)return;L.push('*'+u+'*');g.forEach(i=>L.push('• '+i.q+' × '+i.n+' — '+fm(i.q*i.p)+' F'))});
  L.push('━━━━━━━━━━','*Total : '+fm(total())+' F*','Paiement : '+st.mode+(st.type==='livraison'?' (à la livraison)':st.type==='emporter'?' (au retrait)':''));
  if(st.note.trim())L.push('Précision : '+st.note.trim());
  L.push('Réf : '+(st.type==='table'?'T'+st.table:st.type==='livraison'?'L':'E')+'-'+String(Date.now()).slice(-5));
  return L.join('\n');
}
const waLink=()=>WA?'https://wa.me/'+WA+'?text='+encodeURIComponent(msg()):'';
function top(){
  const n=count();
  return '<header class="top"><div class="brand"><b>KACTUS <i>·</i> TALA</b><small>'+esc((D&&D.adresse)||'Bamako')+'</small></div>'+
    (st.type==='table'?'<span class="chip"><span>Table</span><b>'+esc(st.table)+'</b></span>':st.type?'<span class="chip"><span>'+(st.type==='livraison'?'🛵':'🥡')+'</span><b style="font-size:1rem">'+TYPES[st.type]+'</b></span>':'')+
    '<button type="button" class="cartb" data-a="cart" aria-label="Ma commande, '+n+' article'+(n>1?'s':'')+'">🛍️'+(n?'<em>'+n+'</em>':'')+'</button></header>';
}
function vMenu(){
  if(!unis().length)return top()+'<div class="empty"><span>🌵</span><h2>La carte arrive bientôt</h2><p>Écrivez-nous sur WhatsApp, nous prendrons votre commande.</p></div>';
  const u=U();st.u=u.u;if(!u.cats.some(c=>c.c===st.cat))st.cat=u.cats[0].c;
  const cat=u.cats.find(c=>c.c===st.cat);let sub=null;
  const items=cat.items.map(it=>{
    const q=qOf(u.u,it.nom),hd=it.sub&&it.sub!==sub?'<h3 class="sub">'+esc(it.sub)+'</h3>':'';sub=it.sub;
    const ctl=q?'<div class="q"><button type="button" data-a="q" data-d="-1" data-n="'+esc(it.nom)+'" aria-label="Retirer un '+esc(it.nom)+'">−</button><b>'+q+'</b><button type="button" data-a="q" data-d="1" data-n="'+esc(it.nom)+'" aria-label="Ajouter un '+esc(it.nom)+'">+</button></div>':'<button type="button" class="add" data-a="add" data-n="'+esc(it.nom)+'">Ajouter</button>';
    return hd+'<article class="it'+(q?' on':'')+(st.last===it.nom?' pop':'')+'" style="--cc:'+esc(cat.col)+'"><div class="ph">'+(it.img?'<img alt="" loading="lazy" src="'+esc(it.img)+'" data-emo="'+esc(cat.emo)+'">':esc(cat.emo))+'</div>'+
      '<div class="ib"><h3>'+esc(it.nom)+'</h3>'+(it.desc?'<p>'+esc(it.desc)+'</p>':'')+'<div class="ir"><span class="pr">'+money(it.prix)+'</span>'+ctl+'</div></div></article>';
  }).join('');
  const n=count();
  return top()+'<section class="hero"><h1>Notre carte</h1><p>'+(st.type==='table'?'Choisissez, puis envoyez votre commande sur WhatsApp. On vous l\'apporte à la table '+esc(st.table)+'.':'Commandez à emporter ou en livraison. Vous payez à la remise de votre commande.')+'</p></section>'+
   (unis().length>1?'<div class="seg" role="group" aria-label="Rubrique">'+unis().map(x=>'<button type="button" data-a="uni" data-u="'+x.u+'" aria-pressed="'+(x.u===u.u)+'">'+(x.u==='KACTUS'?'☕ KACTUS':'🏺 TALA')+'</button>').join('')+'</div>':'')+
   '<div class="cats" role="group" aria-label="Catégories">'+u.cats.map(c=>'<button type="button" data-a="cat" data-c="'+esc(c.c)+'" aria-pressed="'+(c.c===st.cat)+'">'+esc(c.emo)+' '+esc(c.label)+'</button>').join('')+'</div>'+
   '<div class="list">'+items+'</div>'+
   (n?'<button type="button" class="bar" data-a="cart"><em>'+n+'</em><span>Voir ma commande</span><strong>'+money(total())+'</strong></button>':'')+
   '<p class="stamp">Carte du '+esc((D&&D.date)||'')+' · les prix peuvent évoluer, l\'équipe vous confirme le total sur WhatsApp.</p>';
}
function ins(){
  const m=st.mode,where=st.type==='livraison'?'au livreur, à la livraison':st.type==='emporter'?'au comptoir, quand vous récupérez votre commande':'au serveur';
  if(m==='Espèces')return '<b>Vous payez en espèces</b> '+where+'.';
  if(m==='Carte')return '<b>Vous payez par carte</b> '+where+'.';
  return '<b>Vous payez par '+esc(m)+'</b> '+where+'. Rien à payer maintenant.';
}
const f=(id,lab,val,ph,type,extra)=>'<div class="field"><label for="'+id+'">'+lab+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'" '+(extra||'')+'></div>';
function vCart(){
  if(!st.cart.length)return top()+'<button type="button" class="back" data-a="menu">← La carte</button><div class="empty"><span>🛍️</span><h2>Votre commande est vide</h2><p>Ajoutez des produits depuis la carte.</p></div>';
  if(st.type==='livraison'&&st.mode==='Carte')st.mode='Espèces';
  const lines=st.cart.map(i=>'<div class="ln"><div class="n">'+esc(i.n)+'<small>'+money(i.p)+' · '+i.u+'</small></div><div class="q"><button type="button" data-a="q" data-u="'+i.u+'" data-d="-1" data-n="'+esc(i.n)+'" aria-label="Retirer un '+esc(i.n)+'">−</button><b>'+i.q+'</b><button type="button" data-a="q" data-u="'+i.u+'" data-d="1" data-n="'+esc(i.n)+'" aria-label="Ajouter un '+esc(i.n)+'">+</button></div><span class="p">'+money(i.q*i.p)+'</span></div>').join('');
  const mi=missing(),ok=!mi.length&&!!WA,L=ok?waLink():'';
  const who=st.type==='table'?'':
   '<section class="card"><h2>Retrait ou livraison ?</h2><div class="modes" role="group" aria-label="Retrait ou livraison">'+
    '<button type="button" data-a="type" data-t="emporter" aria-pressed="'+(st.type==='emporter')+'">🥡 À emporter</button><button type="button" data-a="type" data-t="livraison" aria-pressed="'+(st.type==='livraison')+'">🛵 Livraison</button></div>'+
    (st.type?f('k-name','Votre prénom',st.name,'Ex. Awa','text','maxlength="40" autocomplete="given-name"')+f('k-tel','Votre numéro de téléphone',st.tel,'Ex. 70 12 34 56','tel','maxlength="20" inputmode="tel" autocomplete="tel"')+
     (st.type==='livraison'?f('k-adr','Adresse de livraison (quartier, rue, porte)',st.adr,'Ex. Badalabougou, rue 136, porte 22','text','maxlength="120" autocomplete="street-address"')+f('k-rep','Point de repère (facultatif)',st.rep,'Ex. à côté de la pharmacie','text','maxlength="80"'):'')+
     '<div class="field"><label for="k-h">'+(st.type==='livraison'?'Heure de livraison souhaitée':'Heure de retrait')+'</label><input id="k-h" type="time" value="'+esc(st.heure)+'"><small style="color:var(--mut)">Laissez vide pour « dès que possible ».</small></div>'+
     (st.type==='livraison'?'<p class="note" style="text-align:left">Les éventuels frais de livraison vous sont confirmés sur WhatsApp avant le départ.</p>':'<p class="note" style="text-align:left">Retrait chez KACTUS · TALA, '+esc((D&&D.adresse)||'Bamako')+'.</p>'):'')+'</section>';
  return top()+'<button type="button" class="back" data-a="menu">← Continuer mes achats</button>'+
   '<section class="card"><h2>Ma commande'+(st.type==='table'?' · table '+esc(st.table):'')+'</h2><div>'+lines+'</div><div class="tot"><span>Total</span><strong>'+money(total())+'</strong></div></section>'+who+
   (st.type?'<section class="card"><h2>Comment réglerez-vous ?</h2><div class="modes" role="group" aria-label="Paiement">'+modes().map(m=>'<button type="button" data-a="mode" data-m="'+esc(m)+'" aria-pressed="'+(m===st.mode)+'">'+IC[m]+' '+esc(m)+'</button>').join('')+'</div><div class="ins">'+ins()+'</div></section>':'')+
   '<section class="card">'+(st.type==='table'?f('k-name','Votre prénom (facultatif)',st.name,'','text','maxlength="40" autocomplete="given-name"'):'')+
   '<div class="field"><label for="k-note">Une précision pour la cuisine ? (facultatif)</label><input id="k-note" type="text" maxlength="140" placeholder="Ex. sans sucre, bien chaud" value="'+esc(st.note)+'"></div>'+
   (!WA?'<div class="ins"><b>Commande en ligne indisponible pour le moment.</b> Appelez-nous ou écrivez-nous sur WhatsApp.</div>':
    ok?'<a class="go" id="k-go" href="'+esc(L)+'" target="_blank" rel="noopener noreferrer" data-a="sent">💬 Envoyer ma commande sur WhatsApp</a><p class="note">WhatsApp s\'ouvre avec votre commande déjà écrite : il ne reste qu\'à appuyer sur Envoyer.</p>'
      :'<a class="go" id="k-go" aria-disabled="true">💬 Envoyer ma commande sur WhatsApp</a><p class="note" id="k-miss">Il manque : '+esc(mi.join(', '))+'.</p>')+
   (st.sent?'<div class="ok"><span>✅</span><div><b>Dernière étape dans WhatsApp</b><br>Si le message est bien parti, l\'équipe vous répond pour confirmer. WhatsApp ne s\'est pas ouvert ? Copiez le message ci-dessous et envoyez-le au +'+esc(WA)+'.</div></div><div class="msg" id="k-msg">'+esc(msg())+'</div><button type="button" class="ghost" data-a="copy">Copier le message</button><button type="button" class="ghost" data-a="reset">Nouvelle commande</button>':'')+
   '</section>';
}
function render(){
  const a=document.activeElement,id=a&&a.id,v=a&&a.value,sy=window.scrollY;
  $('#app').innerHTML=st.view==='cart'?vCart():vMenu();
  if(id){const n=document.getElementById(id);if(n){n.focus();if(v!=null&&n.value!==v)n.value=v}}
  if(st.keep)window.scrollTo(0,sy);st.keep=false;
}
function refreshGo(){
  const g=$('#k-go'),mi=missing(),ok=!mi.length&&!!WA;if(!g)return;
  if(ok){g.removeAttribute('aria-disabled');g.href=waLink();g.target='_blank';g.rel='noopener noreferrer';g.dataset.a='sent';const m=$('#k-miss');if(m){m.id='';m.textContent='WhatsApp s\'ouvre avec votre commande déjà écrite : il ne reste qu\'à appuyer sur Envoyer.'}}
  else{g.setAttribute('aria-disabled','true');g.removeAttribute('href');delete g.dataset.a;const m=$('#k-miss')||(g.nextElementSibling&&g.nextElementSibling.classList.contains('note')?g.nextElementSibling:null);if(m){m.id='k-miss';m.textContent='Il manque : '+mi.join(', ')+'.'}}
  const k=$('#k-msg');if(k)k.textContent=msg();
}
function go(v){st.view=v;st.keep=false;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='cart'){st.sent=false;go('cart');return}
  if(a==='menu'){go('menu');return}
  if(a==='uni'){st.u=b.dataset.u;st.cat='';st.keep=true;render();return}
  if(a==='cat'){st.cat=b.dataset.c;st.keep=true;render();return}
  if(a==='type'){st.type=b.dataset.t;st.sent=false;save();st.keep=true;render();return}
  if(a==='add'){const u=U(),it=find(u.u,b.dataset.n);if(!it)return;const x=st.cart.find(i=>i.u===u.u&&i.n===it.nom);if(x)x.q++;else st.cart.push({u:u.u,n:it.nom,p:it.prix,q:1});st.last=it.nom;save();st.keep=true;render();setTimeout(()=>{st.last=''},400);return}
  if(a==='q'){const u=b.dataset.u||U().u,x=st.cart.find(i=>i.u===u&&i.n===b.dataset.n);if(!x)return;x.q+=+b.dataset.d;if(x.q<=0)st.cart.splice(st.cart.indexOf(x),1);st.sent=false;save();st.keep=true;render();return}
  if(a==='mode'){st.mode=b.dataset.m;st.sent=false;save();st.keep=true;render();return}
  if(a==='sent'){setTimeout(()=>{st.sent=true;st.keep=true;render()},300);return}
  if(a==='copy'){const t=msg();const done=()=>{b.textContent='Message copié ✓'};try{navigator.clipboard.writeText(t).then(done,()=>{sel()})}catch(x){sel()}return}
  if(a==='reset'){st.cart=[];st.note='';st.sent=false;save();go('menu');return}
});
function sel(){const m=$('#k-msg');if(!m)return;const r=document.createRange();r.selectNodeContents(m);const s=getSelection();s.removeAllRanges();s.addRange(r)}
const FIELDS={'k-note':'note','k-name':'name','k-tel':'tel','k-adr':'adr','k-rep':'rep','k-h':'heure'};
document.addEventListener('input',e=>{const k=FIELDS[e.target.id];if(!k)return;st[k]=e.target.value;save();refreshGo()});
document.addEventListener('change',e=>{const k=FIELDS[e.target.id];if(!k)return;st[k]=e.target.value;save();refreshGo()});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.dataset.emo)t.replaceWith(document.createTextNode(t.dataset.emo))},true);
render();
})();
